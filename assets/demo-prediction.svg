<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1200" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEFDF5"/>
      <stop offset="1" stop-color="#FFF4E8"/>
    </linearGradient>
    <linearGradient id="head3" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#136F63"/>
      <stop offset="1" stop-color="#F4A261"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#B6C9BA" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1200" height="700" rx="28" fill="url(#bg3)"/>
  <rect x="70" y="55" width="1060" height="590" rx="26" fill="#FFFFFF" filter="url(#shadow3)"/>
  <rect x="70" y="55" width="1060" height="78" rx="26" fill="url(#head3)"/>
  <text x="112" y="102" fill="#FFFFFF" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Traffic Volume Prediction Interface</text>

  <rect x="105" y="165" width="510" height="425" rx="24" fill="#FAFFFD" stroke="#C4E7D9"/>
  <text x="135" y="205" fill="#24574E" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Input Controls</text>

  <text x="135" y="250" fill="#355C56" font-size="18" font-family="Segoe UI, Arial, sans-serif">Temperature (C)</text>
