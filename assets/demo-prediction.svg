  <text x="685" y="320" fill="#D97706" font-size="48" font-family="Segoe UI, Arial, sans-serif" font-weight="800">5,142</text>

  <rect x="655" y="385" width="390" height="205" rx="24" fill="#F7FBFF" stroke="#D4E3F2"/>
  <text x="685" y="428" fill="#24435B" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Model Summary</text>
  <rect x="685" y="452" width="330" height="38" rx="11" fill="#ECF5FC"/>
