  <text x="135" y="350" fill="#355C56" font-size="18" font-family="Segoe UI, Arial, sans-serif">Snow (1h)</text>
  <rect x="330" y="330" width="240" height="34" rx="10" fill="#F1FBF7" stroke="#C8E7DB"/>
  <text x="350" y="352" fill="#1E6157" font-size="18" font-family="Consolas, Arial, sans-serif">0.0</text>

