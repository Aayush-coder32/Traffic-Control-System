  <text x="350" y="402" fill="#1E6157" font-size="18" font-family="Consolas, Arial, sans-serif">50</text>

  <text x="135" y="450" fill="#355C56" font-size="18" font-family="Segoe UI, Arial, sans-serif">Hour / Day / Month</text>
  <rect x="330" y="430" width="240" height="34" rx="10" fill="#F1FBF7" stroke="#C8E7DB"/>
  <text x="350" y="452" fill="#1E6157" font-size="18" font-family="Consolas, Arial, sans-serif">12 / 15 / 6</text>

  <rect x="135" y="505" width="435" height="52" rx="14" fill="#136F63"/>
  <text x="248" y="539" fill="#FFFFFF" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Predict Traffic Volume</text>

  <rect x="655" y="165" width="390" height="190" rx="24" fill="#FFF9F2" stroke="#F2D8B5"/>
  <text x="685" y="208" fill="#6A4A1B" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Prediction Output</text>
