  <text x="705" y="476" fill="#35546E" font-size="18" font-family="Segoe UI, Arial, sans-serif">Algorithm: Random Forest Regressor</text>
  <text x="705" y="527" fill="#35546E" font-size="18" font-family="Segoe UI, Arial, sans-serif">Features: weather + time variables</text>
  <text x="705" y="578" fill="#35546E" font-size="18" font-family="Segoe UI, Arial, sans-serif">Metric: R2 score displayed in app</text>

  <text x="110" y="665" fill="#5E6D66" font-size="18" font-family="Segoe UI, Arial, sans-serif">Illustrative prediction mockup for repository presentation</text>
